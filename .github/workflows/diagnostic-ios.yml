name: iOS Card History Diagnostic

on:
  push:
    branches: [diagnose/card-history-grouping]

permissions:
  contents: read

concurrency:
  group: ios-card-history-${{ github.ref }}
  cancel-in-progress: false

jobs:
  history:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - name: Record runtime and source
        run: |
          set -euo pipefail
          xcodebuild -version | tee xcode-version.txt
          sw_vers > macos-version.txt
          git rev-parse HEAD > source-revision.txt
          xcrun simctl list devices available -j > simulators.json
          device_id=$(python3 -c 'import json; devices=json.load(open("simulators.json"))["devices"]["com.apple.CoreSimulator.SimRuntime.iOS-18-5"]; print(next(d["udid"] for d in devices if d["name"] == "iPhone 16 Pro"))')
          echo "HISTORY_DEVICE_ID=$device_id" >> "$GITHUB_ENV"
      - name: Validate large card history and refresh
        run: |
          set -euo pipefail
          mkdir -p save-diagnostics
          sample_after_confirmation() {
            set +e
            history_deadline=$((SECONDS + 1200))
            while (( SECONDS < history_deadline )); do
              history_save_taps=$(awk '/t =.*Tap "saveTransaction" Button/ { count++ } END { print count+0 }' xcodebuild.log 2>/dev/null)
              if [ "${history_save_taps:-0}" -ge 2 ]; then
                date -u +%Y-%m-%dT%H:%M:%SZ > save-diagnostics/triggered-at.txt
                tail -n 25 xcodebuild.log > save-diagnostics/trigger-events.log
                ps -axo pid,ppid,pcpu,rss,etime,comm > save-diagnostics/processes.txt
                /usr/bin/sample -h > save-diagnostics/sample-help.txt 2>&1
                history_app_pid=$(pgrep -x CardPilot | head -n 1)
                history_runner_pid=$(pgrep -f '/CardPilotUITests-Runner.app/CardPilotUITests-Runner' | head -n 1)
                printf 'app=%s\nrunner=%s\n' "$history_app_pid" "$history_runner_pid" > save-diagnostics/pids.txt
                if [ -n "$history_app_pid" ]; then
                  ( /usr/bin/sample "$history_app_pid" 5 10 -mayDie -file save-diagnostics/app-sample.txt > save-diagnostics/app-sample.log 2>&1
                    printf '%s\n' "$?" > save-diagnostics/app-sample-exit.txt ) &
                  history_app_sample=$!
                fi
                if [ -n "$history_runner_pid" ]; then
                  ( /usr/bin/sample "$history_runner_pid" 5 10 -mayDie -file save-diagnostics/runner-sample.txt > save-diagnostics/runner-sample.log 2>&1
                    printf '%s\n' "$?" > save-diagnostics/runner-sample-exit.txt ) &
                  history_runner_sample=$!
                fi
                if [ -n "${history_app_sample:-}" ]; then wait "$history_app_sample"; fi
                if [ -n "${history_runner_sample:-}" ]; then wait "$history_runner_sample"; fi
                return
              fi
              sleep 1
            done
            printf 'Confirmation save was not observed before sampler deadline.\n' > save-diagnostics/not-triggered.txt
          }
          sample_after_confirmation &
          history_sampler_pid=$!
          trap 'kill "$history_sampler_pid" 2>/dev/null || :' EXIT
          NSUnbufferedIO=YES xcodebuild test \
            -project CardPilot.xcodeproj -scheme CardPilot \
            -destination "platform=iOS Simulator,id=$HISTORY_DEVICE_ID" \
            -resultBundlePath CardHistoryResults.xcresult \
            -only-testing:CardPilotUITests/CoreFlowsUITests/testLargeCardHistoryScopesRowsAndRefreshesAfterRecording \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 240 \
            CODE_SIGNING_ALLOWED=NO | tee xcodebuild.log
      - name: Export native evidence
        if: always()
        run: |
          set -euo pipefail
          xcrun xcresulttool get test-results summary --path CardHistoryResults.xcresult > summary.json
          xcrun xcresulttool export attachments --path CardHistoryResults.xcresult --output-path test-attachments
          python3 - <<'PYTHON'
          import json, os, pathlib, shutil
          devices = json.load(open("simulators.json"))["devices"]
          device = next(device for values in devices.values() for device in values if device["udid"] == os.environ["HISTORY_DEVICE_ID"])
          source = pathlib.Path(device["dataPath"])
          destination = pathlib.Path("fixture-reports")
          destination.mkdir(exist_ok=True)
          for report in source.glob("Containers/Data/Application/*/tmp/CardPilotUITests/*/performance-fixture.json"):
              shutil.copyfile(report, destination / f"{report.parent.name}.json")
          for error in source.glob("Containers/Data/Application/*/tmp/CardPilotUITests/*/performance-fixture-error.txt"):
              shutil.copyfile(error, destination / f"{error.parent.name}-error.txt")
          PYTHON
      - name: Upload native results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-card-history-results
          path: |
            CardHistoryResults.xcresult
            summary.json
            test-attachments
            fixture-reports
            xcodebuild.log
            xcode-version.txt
            macos-version.txt
            simulators.json
            source-revision.txt
            save-diagnostics
          retention-days: 14
          if-no-files-found: error
