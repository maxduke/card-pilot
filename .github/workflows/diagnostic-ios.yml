name: iOS Account Name Data Compatibility Diagnostic

on:
  push:
    branches: [diagnose/released-data-compatibility]

permissions:
  contents: read

concurrency:
  group: ios-released-data-compatibility-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compatibility:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - name: Record native source and runtime
        run: |
          set -euo pipefail
          xcodebuild -version | tee xcode-version.txt
          sw_vers > macos-version.txt
          git rev-parse HEAD > source-revision.txt
          xcrun simctl list devices available -j > simulators.json
          python3 - <<'PYTHON'
          import json, os, pathlib
          devices = json.load(open("simulators.json"))["devices"]["com.apple.CoreSimulator.SimRuntime.iOS-18-5"]
          device = next(d for d in devices if d["name"] == "iPhone 16 Pro")
          pathlib.Path("device.json").write_text(json.dumps(device, indent=2) + "\n")
          with open(os.environ["GITHUB_ENV"], "a") as stream:
              stream.write(f"COMPATIBILITY_DEVICE_ID={device['udid']}\n")
          PYTHON
      - name: Verify actual released data with current application
        run: |
          set -euo pipefail
          xcodebuild test \
            -project CardPilot.xcodeproj -scheme CardPilot \
            -destination "platform=iOS Simulator,id=$COMPATIBILITY_DEVICE_ID" \
            -resultBundlePath ReleasedCompatibilityResults.xcresult \
            -only-testing:CardPilotTests \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 240 \
            CODE_SIGNING_ALLOWED=NO | tee xcodebuild.log
      - name: Export native evidence
        if: always()
        run: |
          set -euo pipefail
          xcrun xcresulttool get test-results summary --path ReleasedCompatibilityResults.xcresult > summary.json
          python3 - <<'PYTHON'
          import json
          summary = json.load(open("summary.json"))
          assert (summary["passedTests"], summary["failedTests"], summary["skippedTests"]) == (231, 0, 0), summary
          PYTHON
      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-released-data-compatibility
          path: |
            ReleasedCompatibilityResults.xcresult
            summary.json
            xcodebuild.log
            xcode-version.txt
            macos-version.txt
            source-revision.txt
            device.json
          retention-days: 14
          if-no-files-found: error
