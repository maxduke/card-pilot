name: iOS Editor Status Diagnostic

on:
  push:
    branches: [diagnose/accessible-editor-status]

permissions:
  contents: read

concurrency:
  group: ios-editor-status-${{ github.ref }}
  cancel-in-progress: false

jobs:
  editor-status-ui:
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iphone16pro
            device: iPhone 16 Pro
          - name: iphonese3
            device: iPhone SE (3rd generation)
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      EDITOR_STATUS_DEVICE: ${{ matrix.device }}
    steps:
      - uses: actions/checkout@v5
      - name: Record native source and runtime
        run: |
          set -euo pipefail
          xcodebuild -version | tee xcode-version.txt
          sw_vers > macos-version.txt
          git rev-parse HEAD > source-revision.txt
          xcrun simctl list devices available -j > simulators.json
          python3 - <<'PYTHON'
          import json, os, pathlib
          devices = json.load(open("simulators.json"))["devices"]["com.apple.CoreSimulator.SimRuntime.iOS-18-5"]
          device = next(d for d in devices if d["name"] == os.environ["EDITOR_STATUS_DEVICE"])
          pathlib.Path("device.json").write_text(json.dumps(device, indent=2) + "\n")
          with open(os.environ["GITHUB_ENV"], "a") as stream:
              stream.write(f"EDITOR_STATUS_DEVICE_ID={device['udid']}\n")
          PYTHON
      - name: Verify status selection and affected numeric keyboard layouts
        run: |
          set -euo pipefail
          xcodebuild test \
            -project CardPilot.xcodeproj -scheme CardPilot \
            -destination "platform=iOS Simulator,id=$EDITOR_STATUS_DEVICE_ID" \
            -resultBundlePath EditorStatusResults.xcresult \
            -only-testing:CardPilotUITests/CoreFlowsUITests/testAccountStatusMenuSavesClosedAccountAfterRelaunch \
            -only-testing:CardPilotUITests/CoreFlowsUITests/testAccountStatusAtLargestTextSizeShowsChoicesAndDiscardsChanges \
            -only-testing:CardPilotUITests/CoreFlowsUITests/testCardStatusMenuSavesInactiveCardAfterRelaunch \
            -only-testing:CardPilotUITests/CoreFlowsUITests/testCardStatusAtLargestTextSizeShowsChoicesAndDiscardsChanges \
            -only-testing:CardPilotUITests/CoreFlowsUITests/testAccountEditorNumericKeyboardAtLargestTextSize \
            -only-testing:CardPilotUITests/CoreFlowsUITests/testCardEditorNumericKeyboardAtLargestTextSize \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 240 \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild.log
      - name: Export native originals and test evidence
        if: always()
        run: |
          set -euo pipefail
          xcrun xcresulttool get test-results summary --path EditorStatusResults.xcresult > summary.json
          xcrun xcresulttool export attachments --path EditorStatusResults.xcresult --output-path test-attachments
          python3 - <<'PYTHON'
          import json
          summary = json.load(open("summary.json"))
          assert (summary["passedTests"], summary["failedTests"], summary["skippedTests"]) == (6, 0, 0), summary
          PYTHON
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-editor-status-ui-${{ matrix.name }}
          path: |
            EditorStatusResults.xcresult
            summary.json
            test-attachments
            xcodebuild.log
            xcode-version.txt
            macos-version.txt
            source-revision.txt
            device.json
          retention-days: 14
          if-no-files-found: error
