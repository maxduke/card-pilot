name: Native Reminder and Date Readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        group: [reminder, date]
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      NATIVE_CHECK_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v5
      - name: Record exact source and original complete flows
        run: |
          set -euo pipefail
          git rev-parse HEAD > source-revision.txt
          git rev-parse HEAD:CardPilot > application-tree.txt
          shasum -a 256 CardPilotUITests/CoreFlowsUITests.swift > ui-test-source.sha256
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          tests = {
              'reminder': ['testFirstCardReminderSettingsPersistAndRemainAccessible'],
              'date': ['testAccountBillingDateWheelsAtLargestTextSizeSaveAndPreserveRepayment']
          }[os.environ['NATIVE_CHECK_GROUP']]
          Path('test-selections.txt').write_text('\n'.join('-only-testing:CardPilotUITests/CoreFlowsUITests/' + t for t in tests) + '\n')
          Path('test-partition.json').write_text(json.dumps({'tests': tests, 'iterations': 2}, indent=2) + '\n')
          PY
          xcodebuild -version > xcode-version.txt
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]["com.apple.CoreSimulator.SimRuntime.iOS-18-5"]; print(next(d["udid"] for d in devices if d["name"] == "iPhone 16 Pro"))')
          echo "NATIVE_CHECK_DEVICE=$device_id" >> "$GITHUB_ENV"
      - name: Execute original flows twice without failure retries
        run: |
          set -euo pipefail
          : > xcodebuild.log
          python3 -u scripts/capture_app_idle.py xcodebuild.log "$NATIVE_CHECK_DEVICE" > app-idle-monitor.log 2>&1 &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true; wait "$monitor_pid" 2>/dev/null || true' EXIT
          test_args=(
            -project CardPilot.xcodeproj -scheme CardPilot
            -destination "platform=iOS Simulator,id=$NATIVE_CHECK_DEVICE"
            -resultBundlePath NativeResults.xcresult
            -test-iterations 2 -parallel-testing-enabled NO
            -test-timeouts-enabled YES
            -default-test-execution-time-allowance 180
            -maximum-test-execution-time-allowance 300
            CODE_SIGNING_ALLOWED=NO
          )
          while IFS= read -r selector; do test_args+=("$selector"); done < test-selections.txt
          xcodebuild test "${test_args[@]}" 2>&1 | tee xcodebuild.log
      - name: Export evidence
        if: always()
        run: |
          xcrun xcresulttool get test-results summary --path NativeResults.xcresult > summary.json
          xcrun xcresulttool export attachments --path NativeResults.xcresult --output-path test-attachments
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-readiness-${{ matrix.group }}
          path: |
            NativeResults.xcresult
            source-revision.txt
            application-tree.txt
            ui-test-source.sha256
            xcode-version.txt
            test-partition.json
            test-selections.txt
            summary.json
            xcodebuild.log
            app-idle-monitor.log
            app-idle-diagnostics
            test-attachments
          retention-days: 7
