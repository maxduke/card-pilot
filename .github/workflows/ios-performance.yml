name: Promotion Navigation Comparison

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparison:
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, always-search, inline-root]
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      PROBE_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v5
      - name: Record source and apply isolated comparison
        run: |
          set -euo pipefail
          git rev-parse HEAD > source-revision.txt
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path('CardPilot/Features/Promotions/PromotionsView.swift')
          text = p.read_text()
          variant = os.environ['PROBE_VARIANT']
          if variant == 'always-search':
              old = '.searchable(text: $searchText, prompt: "搜索活动、主办方或适用卡")'
              new = '.searchable(text: $searchText, placement: .navigationBarDrawer(displayMode: .always), prompt: "搜索活动、主办方或适用卡")'
          elif variant == 'inline-root':
              old = '.navigationTitle("促销")'
              new = '.navigationTitle("促销")\n            .navigationBarTitleDisplayMode(.inline)'
          else:
              assert variant == 'baseline'
              old = new = None
          if old:
              assert text.count(old) == 1
              p.write_text(text.replace(old, new))
          PY
          git diff -- CardPilot/Features/Promotions/PromotionsView.swift > comparison.patch
          shasum -a 256 CardPilot/Features/Promotions/PromotionsView.swift > comparison-source.sha256
          xcodebuild -version > xcode-version.txt
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]["com.apple.CoreSimulator.SimRuntime.iOS-18-5"]; print(next(d["udid"] for d in devices if d["name"] == "iPhone 16 Pro"))')
          echo "PROBE_DEVICE_ID=$device_id" >> "$GITHUB_ENV"
      - name: Run unchanged full overview flow three times
        run: |
          set -euo pipefail
          : > xcodebuild.log
          python3 -u scripts/capture_app_idle.py xcodebuild.log "$PROBE_DEVICE_ID" > app-idle-monitor.log 2>&1 &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true; wait "$monitor_pid" 2>/dev/null || true' EXIT
          xcodebuild test \
            -project CardPilot.xcodeproj -scheme CardPilot \
            -destination "platform=iOS Simulator,id=$PROBE_DEVICE_ID" \
            -resultBundlePath NavigationResults.xcresult \
            -only-testing:CardPilotUITests/CoreFlowsUITests/testPromotionOverviewPrioritizesProgressAndDistinguishesLimits \
            -test-iterations 3 -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild.log
      - name: Export evidence
        if: always()
        run: |
          xcrun xcresulttool get test-results summary --path NavigationResults.xcresult > summary.json
          xcrun xcresulttool export attachments --path NavigationResults.xcresult --output-path test-attachments
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: promotion-navigation-${{ matrix.variant }}
          path: |
            NavigationResults.xcresult
            source-revision.txt
            comparison.patch
            comparison-source.sha256
            xcode-version.txt
            summary.json
            xcodebuild.log
            app-idle-monitor.log
            app-idle-diagnostics
            test-attachments
          retention-days: 7
