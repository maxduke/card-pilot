name: Promotion return audit order diagnostic

on:
  push:
    branches: [diagnose/promotion-return-audit-order]

concurrency:
  group: promotion-return-audit-order-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        audit_order: [after-loop]
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      AUDIT_ORDER: ${{ matrix.audit_order }}
    steps:
      - uses: actions/checkout@v5
      - name: Build and test one controlled variant
        run: |
          set -euo pipefail
          xcodebuild -version
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]["com.apple.CoreSimulator.SimRuntime.iOS-18-5"]; print(next(d["udid"] for d in devices if d["name"] == "iPhone 16 Pro"))')
          build_conditions='DEBUG PROMOTION_RETURN_DIAGNOSTIC'
          if [ "$AUDIT_ORDER" = after-loop ]; then
            build_conditions="$build_conditions PROMOTION_RETURN_AUDIT_AFTER_LOOP"
          fi
          git rev-parse HEAD > source-sha.txt
          export DEVICE_ID="$device_id" BUILD_CONDITIONS="$build_conditions"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('diagnostic-configuration.json').write_text(json.dumps({
              'kind': 'controlled-diagnostic-not-performance-baseline',
              'sourceSha': Path('source-sha.txt').read_text().strip(),
              'auditOrder': os.environ['AUDIT_ORDER'],
              'buildConditions': os.environ['BUILD_CONDITIONS'],
              'deviceId': os.environ['DEVICE_ID'],
              'device': 'iPhone 16 Pro', 'iOS': '18.5', 'Xcode': '16.4',
              'configuration': 'Debug', 'normalReturnRounds': 3,
              'normalDetailReturns': 15, 'auditCount': 1,
              'caseCount': 1, 'maximumCaseSeconds': 600,
              'note': 'Distinct audit-order variants are comparisons, not retries or formal full-suite verification.'
          }, indent=2) + '\n')
          PY
          : > xcodebuild.log
          python3 -u scripts/capture_app_idle.py xcodebuild.log "$device_id" > app-idle-monitor.log 2>&1 &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true; wait "$monitor_pid" 2>/dev/null || true' EXIT
          xcodebuild test \
            -project CardPilot.xcodeproj \
            -scheme CardPilot \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$device_id" \
            -resultBundlePath TestResults.xcresult \
            -only-testing:CardPilotUITests/CoreFlowsUITests/testPromotionOverviewPrioritizesProgressAndDistinguishesLimits \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 600 \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="$build_conditions" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee xcodebuild.log
      - name: Export native test evidence
        if: always()
        run: |
          set -euo pipefail
          xcrun xcresulttool get test-results summary --path TestResults.xcresult > summary.json
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path test-attachments
      - name: Upload native test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: promotion-return-${{ matrix.audit_order }}
          path: |
            TestResults.xcresult
            summary.json
            test-attachments
            xcodebuild.log
            diagnostic-configuration.json
            source-sha.txt
            app-idle-monitor.log
            app-idle-diagnostics
          retention-days: 7
          if-no-files-found: warn
