name: iOS

on:
  push:
    branches: [diagnose/promotion-accessible-dates]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - name: Build and test
        run: |
          set -euo pipefail
          xcodebuild -version
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]["com.apple.CoreSimulator.SimRuntime.iOS-18-5"]; print(next(d["udid"] for d in devices if d["name"] == "iPhone 16 Pro"))')
          xcodebuild test \
            -project CardPilot.xcodeproj \
            -scheme CardPilot \
            -only-testing:CardPilotUITests/CoreFlowsUITests/testPromotionBasicDatesAtLargestTextSizeKeepValuesAndReadableProgress \
            -only-testing:CardPilotUITests/CoreFlowsUITests/testPromotionEnrollmentDatesAtLargestTextSizeDiscardChanges \
            -destination "platform=iOS Simulator,id=$device_id" \
            -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 240 \
            CODE_SIGNING_ALLOWED=NO
      - name: Export native test evidence
        if: always()
        run: |
          set -euo pipefail
          xcrun xcresulttool get test-results summary --path TestResults.xcresult > summary.json
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path test-attachments
      - name: Upload native test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: |
            TestResults.xcresult
            summary.json
            test-attachments
          retention-days: 7
          if-no-files-found: warn
