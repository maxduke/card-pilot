name: iOS

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native_tests:
    name: Native tests (shard ${{ matrix.shard }})
    runs-on: macos-15
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        shard: [0, 1, 2, 3]
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      UI_TEST_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v5
      - name: Select complete nonoverlapping test partitions
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          root = Path(os.environ["GITHUB_WORKSPACE"])
          ui_file = root / "CardPilotUITests/CoreFlowsUITests.swift"
          regular_ui_files = sorted(p for p in (root / "CardPilotUITests").glob("*.swift")
                                    if not p.read_text().startswith("#if PERFORMANCE_TESTING"))
          assert regular_ui_files == [ui_file], "Update partition coverage for new UI test files"
          pattern = r"^\s+func (test\w+)\s*\("
          ui_tests = sorted(re.findall(pattern, ui_file.read_text(), re.M))
          assert ui_tests and len(ui_tests) == len(set(ui_tests)), "UI test names must be unique"
          shard = int(os.environ["UI_TEST_SHARD"])
          shard_count = 4
          assert 0 <= shard < shard_count
          selected = ui_tests[shard::shard_count]
          unit_count = sum(len(re.findall(pattern, p.read_text(), re.M))
                           for p in (root / "CardPilotTests").glob("*.swift")) if shard == 0 else 0
          selectors = (["-only-testing:CardPilotTests"] if shard == 0 else [])
          selectors += [f"-only-testing:CardPilotUITests/CoreFlowsUITests/{name}" for name in selected]
          Path("test-selections.txt").write_text("\n".join(selectors) + "\n")
          partition = {"shard": shard, "shardCount": shard_count, "unitCount": unit_count, "uiTests": selected,
                       "totalUITestCount": len(ui_tests), "expectedCount": unit_count + len(selected)}
          Path("test-partition.json").write_text(json.dumps(partition, indent=2) + "\n")
          print(json.dumps(partition, indent=2))
          PY
      - name: Build and test
        run: |
          set -euo pipefail
          git rev-parse HEAD > source-revision.txt
          xcodebuild -version | tee xcode-version.txt
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]["com.apple.CoreSimulator.SimRuntime.iOS-18-5"]; print(next(d["udid"] for d in devices if d["name"] == "iPhone 16 Pro"))')
          echo "CARDPILOT_TEST_DEVICE_ID=$device_id" >> "$GITHUB_ENV"
          : > xcodebuild.log
          python3 -u scripts/capture_app_idle.py xcodebuild.log "$device_id" > app-idle-monitor.log 2>&1 &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true; wait "$monitor_pid" 2>/dev/null || true' EXIT
          test_args=(
            -project CardPilot.xcodeproj -scheme CardPilot
            -destination "platform=iOS Simulator,id=$device_id"
            -resultBundlePath TestResults.xcresult
            -parallel-testing-enabled NO -test-timeouts-enabled YES
            -default-test-execution-time-allowance 180
            -maximum-test-execution-time-allowance 300
            CODE_SIGNING_ALLOWED=NO
          )
          while IFS= read -r selector; do test_args+=("$selector"); done < test-selections.txt
          python3 - "${test_args[@]}" <<'PY'
          import json, sys
          from pathlib import Path
          Path("test-command.json").write_text(json.dumps(["xcodebuild", "test", *sys.argv[1:]], indent=2) + "\n")
          PY
          xcodebuild test "${test_args[@]}" 2>&1 | tee xcodebuild.log
      - name: Export native test evidence
        if: always()
        run: |
          set -euo pipefail
          python3 - "${CARDPILOT_TEST_DEVICE_ID:-}" <<'PY'
          import shutil, sys
          from pathlib import Path
          copied = 0
          if sys.argv[1]:
              device = Path.home() / "Library/Developer/CoreSimulator/Devices" / sys.argv[1]
              for source in (device / "data/Containers/Data/Application").glob("*/tmp/CardPilotUITestDiagnostics"):
                  destination = Path("test-failure-artifacts") / source.parents[1].name
                  shutil.copytree(source, destination, dirs_exist_ok=True)
                  copied += 1
          print(f"Copied direct native artifacts from {copied} simulator containers (including shutdown devices).")
          PY
          xcrun xcresulttool get test-results summary --path TestResults.xcresult > summary.json
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path test-attachments
          python3 - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path("summary.json").read_text())
          partition = json.loads(Path("test-partition.json").read_text())
          assert summary["result"] == "Passed", summary
          assert summary["passedTests"] == summary["totalTestCount"] == partition["expectedCount"], summary
          assert summary["failedTests"] == summary["skippedTests"] == summary["expectedFailures"] == 0, summary
          PY
      - name: Upload native test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results-${{ matrix.shard }}
          path: |
            TestResults.xcresult
            summary.json
            test-attachments
            test-failure-artifacts
            xcodebuild.log
            app-idle-monitor.log
            app-idle-diagnostics
            source-revision.txt
            xcode-version.txt
            test-command.json
            test-partition.json
            test-selections.txt
          retention-days: 7
          if-no-files-found: warn

  test:
    name: test
    if: always()
    needs: [native_tests, small-screen-ui]
    runs-on: ubuntu-latest
    steps:
      - name: Require every native and small-screen partition to pass
        env:
          NATIVE_TEST_RESULT: ${{ needs.native_tests.result }}
          SMALL_SCREEN_TEST_RESULT: ${{ needs['small-screen-ui'].result }}
        run: |
          test "$NATIVE_TEST_RESULT" = success
          test "$SMALL_SCREEN_TEST_RESULT" = success

  small-screen-ui:
    name: Small-screen UI (SE 3, dark, ${{ matrix.group }})
    # Request one hosted Mac at a time, while retaining every test partition
    # even if an earlier partition failed.
    needs: native_tests
    if: always()
    runs-on: macos-15
    # The forms group completed its tests in run 42593717618 but hit 25m
    # during the job's remaining work. Keep its full evidence upload in budget.
    timeout-minutes: ${{ matrix.group == 'forms' && 30 || 25 }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        group: [amounts, forms]
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      SE_TEST_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v5
      - name: Run complete small-screen flows
        run: |
          set -euo pipefail
          git rev-parse HEAD > source-revision.txt
          sw_vers > macos-version.txt
          uname -m > architecture.txt
          xcodebuild -version | tee xcode-version.txt
          xcrun simctl list devices available -j > simulators.json
          device_id=$(python3 -c 'import json; devices=json.load(open("simulators.json"))["devices"]["com.apple.CoreSimulator.SimRuntime.iOS-18-5"]; print(next(d["udid"] for d in devices if d["name"] == "iPhone SE (3rd generation)"))')
          echo "CARDPILOT_TEST_DEVICE_ID=$device_id" >> "$GITHUB_ENV"
          device_state=$(python3 -c 'import json, sys; devices=json.load(open("simulators.json"))["devices"]["com.apple.CoreSimulator.SimRuntime.iOS-18-5"]; print(next(d["state"] for d in devices if d["udid"] == sys.argv[1]))' "$device_id")
          if [[ "$device_state" != "Booted" ]]; then
            xcrun simctl boot "$device_id"
          fi
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl ui "$device_id" appearance dark
          xcrun simctl ui "$device_id" appearance > simulator-appearance-before.txt
          xcrun simctl ui "$device_id" increase_contrast enabled
          xcrun simctl ui "$device_id" increase_contrast > simulator-contrast-before.txt
          python3 - <<'PY_APPEARANCE'
          from pathlib import Path
          assert Path("simulator-appearance-before.txt").read_text().strip() == "dark"
          assert Path("simulator-contrast-before.txt").read_text().strip() == "enabled"
          PY_APPEARANCE
          python3 - <<'PY_PARTITION'
          import json, os
          from pathlib import Path
          groups = {
              "amounts": [
                  "testTransactionAmountsRemainReadableWithMixedLengthNames",
                  "testTransactionAmountsRemainReadableAtLargestTextSize",
                  "testLongPrecisionAmountScrollsWithoutSplittingOrChangingDigitsAtLargestTextSize",
                  "testNumericKeyboardDismissalAtLargestTextSize"
              ],
              "forms": [
                  "testBillingSchedulesAtLargestTextSizeSupportAccessibleTextAndNavigationTargets",
                  "testEnrollmentDeadlineAndReminderSettingsRemainDiscoverableAtLargestTextSize",
                  "testPromotionConfirmationGuidanceAndManualOverrideAtLargestTextSize",
                  "testPromotionInlineRulesKeepManualAmountThroughNavigationSaveAndRelaunchAtLargestTextSize"
              ]
          }
          group = os.environ["SE_TEST_GROUP"]
          tests = groups[group]
          all_tests = [name for values in groups.values() for name in values]
          assert len(all_tests) == len(set(all_tests)) == 8
          Path("test-selections.txt").write_text("\n".join(
              "-only-testing:CardPilotUITests/CoreFlowsUITests/" + name for name in tests) + "\n")
          Path("test-partition.json").write_text(json.dumps(
              {"group": group, "tests": tests, "expectedCount": len(tests), "totalSmallScreenCount": len(all_tests)}, indent=2) + "\n")
          PY_PARTITION
          test_args=(
            -project CardPilot.xcodeproj -scheme CardPilot
            -destination "platform=iOS Simulator,id=$device_id"
            -resultBundlePath TestResults.xcresult
            -parallel-testing-enabled NO -test-timeouts-enabled YES
            -default-test-execution-time-allowance 180
            -maximum-test-execution-time-allowance 300
            CODE_SIGNING_ALLOWED=NO
          )
          while IFS= read -r selector; do test_args+=("$selector"); done < test-selections.txt
          python3 - "${test_args[@]}" <<'PY_COMMAND'
          import json, sys
          from pathlib import Path
          Path("test-command.json").write_text(json.dumps(["xcodebuild", "test", *sys.argv[1:]], indent=2) + "\n")
          PY_COMMAND
          : > xcodebuild.log
          python3 -u scripts/capture_app_idle.py xcodebuild.log "$device_id" > app-idle-monitor.log 2>&1 &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true; wait "$monitor_pid" 2>/dev/null || true' EXIT
          xcodebuild test "${test_args[@]}" 2>&1 | tee xcodebuild.log
      - name: Export small-screen test evidence
        if: always()
        run: |
          set -euo pipefail
          python3 - "${CARDPILOT_TEST_DEVICE_ID:-}" <<'PY'
          import shutil, sys
          from pathlib import Path
          copied = 0
          if sys.argv[1]:
              device = Path.home() / "Library/Developer/CoreSimulator/Devices" / sys.argv[1]
              for source in (device / "data/Containers/Data/Application").glob("*/tmp/CardPilotUITestDiagnostics"):
                  destination = Path("test-failure-artifacts") / source.parents[1].name
                  shutil.copytree(source, destination, dirs_exist_ok=True)
                  copied += 1
          print(f"Copied direct native artifacts from {copied} simulator containers (including shutdown devices).")
          PY
          if [[ -n "${CARDPILOT_TEST_DEVICE_ID:-}" ]]; then
            xcrun simctl ui "$CARDPILOT_TEST_DEVICE_ID" appearance > simulator-appearance-after.txt
            xcrun simctl ui "$CARDPILOT_TEST_DEVICE_ID" increase_contrast > simulator-contrast-after.txt
          fi
          xcrun xcresulttool get test-results summary --path TestResults.xcresult > summary.json
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path test-attachments
          python3 - <<'PY_RESULT'
          import json
          from pathlib import Path
          summary = json.loads(Path("summary.json").read_text())
          partition = json.loads(Path("test-partition.json").read_text())
          assert Path("simulator-appearance-after.txt").read_text().strip() == "dark"
          assert Path("simulator-contrast-after.txt").read_text().strip() == "enabled"
          assert summary["result"] == "Passed", summary
          assert summary["passedTests"] == summary["totalTestCount"] == partition["expectedCount"], summary
          assert summary["failedTests"] == summary["skippedTests"] == summary["expectedFailures"] == 0, summary
          PY_RESULT
      - name: Upload small-screen test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-small-screen-test-results-${{ matrix.group }}
          path: |
            TestResults.xcresult
            summary.json
            test-attachments
            test-failure-artifacts
            xcodebuild.log
            app-idle-monitor.log
            app-idle-diagnostics
            source-revision.txt
            test-command.json
            test-selections.txt
            test-partition.json
            xcode-version.txt
            macos-version.txt
            architecture.txt
            simulators.json
            simulator-appearance-before.txt
            simulator-appearance-after.txt
            simulator-contrast-before.txt
            simulator-contrast-after.txt
          retention-days: 7
          if-no-files-found: warn
