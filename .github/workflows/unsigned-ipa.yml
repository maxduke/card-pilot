name: Standalone native audit references (diagnostic only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scope: [root-one, root-many, sheet-many, sheet-clipped]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Prepare independent stock Form references
        env:
          SCOPE: ${{ matrix.scope }}
        run: |
          python3 .github/diagnostics/allocation_standalone_reference.py "$SCOPE"
          printf '%s\n' "$SCOPE" > scope.txt
          printf '%s\n' 'Independent framework reference only. ONE NEW diagnostic UI test per job, no unit/prior/business prefix. From launch a stock NavigationStack/Form shows one or eight caption Text rows, or a stock sheet Form shows eight rows or one intentionally clipped native UILabel. Original 49 UI cases and transaction source are untouched and are NOT run here. Full unfiltered audit retained; known control expected to fail. No delivery evidence.' > source.txt
          git diff --check
          git diff > diagnostic.patch
      - name: Run one independent diagnostic audit
        shell: bash
        run: |
          set -o pipefail
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for devices in data["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          xcodebuild test \
            -project CardPilot.xcodeproj \
            -scheme CardPilot \
            -destination "platform=iOS Simulator,id=$device_id" \
            -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 240 \
            -only-testing:CardPilotUITests/CoreFlowsUITests/testAllocationReferenceClippingAudit \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee diagnostic.log
      - name: Export native summary
        if: always()
        run: xcrun xcresulttool get test-results summary --path TestResults.xcresult > summary.json
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allocation-reference-${{ matrix.scope }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            TestResults.xcresult
            diagnostic.log
            summary.json
            source.txt
            scope.txt
            diagnostic.patch
          retention-days: 7
          if-no-files-found: error
