name: Numeric keyboard readback (diagnostic only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ded078c3d37953aa515ea63b1a8244bf996a6334
          path: candidate
          persist-credentials: false
      - name: Apply the frozen app repair to the exact failed PR head
        working-directory: candidate
        run: |
          git apply --check ../.github/diagnostics/numeric_keyboard_readback.patch
          git apply ../.github/diagnostics/numeric_keyboard_readback.patch
          git diff --check
          python3 - <<'PYCODE'
          import subprocess
          expected = {"CardPilot/Features/Cards/CardsView.swift", "CardPilotUITests/CoreFlowsUITests.swift"}
          actual = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          assert actual == expected, actual
          PYCODE
          git rev-parse HEAD > ../candidate-base.txt
          git diff --binary > ../candidate.patch
      - name: Test all unit tests and three readback and navigation flows
        working-directory: candidate
        shell: bash
        run: |
          set -o pipefail
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for devices in data["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          xcodebuild test \
            -project CardPilot.xcodeproj \
            -scheme CardPilot \
            -destination "platform=iOS Simulator,id=$device_id" \
            -resultBundlePath ../TestResults.xcresult \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 240 \
            -only-testing:CardPilotTests \
            -only-testing:CardPilotUITests/CoreFlowsUITests/testCardOnboardingNumericKeyboardPreservesSavedValues \
            -only-testing:CardPilotUITests/CoreFlowsUITests/testPromotionCreationKeepsGuidanceAndEditingValidatesOtherSections \
            -only-testing:CardPilotUITests/CoreFlowsUITests/testCardOnboardingNumericKeyboardAtLargestTextSize \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee ../diagnostic.log
      - name: Export native summary
        if: always()
        run: xcrun xcresulttool get test-results summary --path TestResults.xcresult > summary.json
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: numeric-keyboard-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            TestResults.xcresult
            diagnostic.log
            summary.json
            candidate-base.txt
            candidate.patch
            .github/diagnostics/numeric_keyboard_readback.patch
          retention-days: 7
          if-no-files-found: error
