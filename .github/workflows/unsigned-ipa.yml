name: Allocation transition validation and clipping control (never delivery)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [identity_preserves_input, identity_clipping_control, animation_preserves_input]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Apply exact layout variant
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          python3 .github/diagnostics/allocation_transition_validation.py "$VARIANT"
          printf '%s\n' "$VARIANT" > variant.txt
          printf '%s\n' 'Base source: PR40 HEAD 8d75a3a3653a8f78de33c47fcb310b183f9afb70. Original invalid input and every original assertion and complete unfiltered audit retained. Two real candidates add post-audit input/error checks. Control intentionally clips one visible diagnostic label and is expected to fail the complete audit. No ignored issues.' > source.txt
          git diff --check
          git diff > diagnostic.patch
      - name: Native diagnostic with full original prefix
        shell: bash
        run: |
          set -o pipefail
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for devices in data["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          device_state=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["state"] for devices in data["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          if [ "$device_state" != Booted ]; then
            xcrun simctl boot "$device_id"
          fi
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl spawn "$device_id" log stream --style compact --level debug \
            --predicate 'subsystem CONTAINS[c] "AXAudit" OR process CONTAINS[c] "AXAudit" OR eventMessage CONTAINS[c] "text clipped" OR eventMessage CONTAINS[c] "textClipped"' \
            > accessibility-audit-system.log 2>&1 &
          audit_log_pid=$!
          trap 'kill "$audit_log_pid" 2>/dev/null || true' EXIT
          xcodebuild test \
            -project CardPilot.xcodeproj \
            -scheme CardPilot \
            -destination "platform=iOS Simulator,id=$device_id" \
            -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 240 \
            -only-testing:CardPilotTests \
            -only-testing:CardPilotUITests/CoreFlowsUITests/testAccountCycleHistoryFindsOlderPaidCyclesAndClearsFilters \
            -only-testing:CardPilotUITests/CoreFlowsUITests/testAccountCycleHistoryPersistsOlderUnpaidCycleRepaymentAcrossSharedCards \
            -only-testing:CardPilotUITests/CoreFlowsUITests/testAccountHistoryFiltersAndSavedFutureDatesAtLargestTextSize \
            -only-testing:CardPilotUITests/CoreFlowsUITests/testAccountHistoryPaidFilterShowsEmptyResultAtLargestTextSize \
            -only-testing:CardPilotUITests/CoreFlowsUITests/testAdditionalCardDoesNotRepeatReminderOnboarding \
            -only-testing:CardPilotUITests/CoreFlowsUITests/testAllocationErrorLocationAndCompletePromptAtLargestTextSize \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee diagnostic.log
      - name: Export native summary
        if: always()
        run: xcrun xcresulttool get test-results summary --path TestResults.xcresult > summary.json
      - name: Preserve original native evidence and exact variant
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allocation-transition-control-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            TestResults.xcresult
            diagnostic.log
            accessibility-audit-system.log
            summary.json
            variant.txt
            source.txt
            diagnostic.patch
          retention-days: 7
          if-no-files-found: error
