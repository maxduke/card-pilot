name: Full native audit metadata (diagnostic only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: 23bd9279df208dd6b31cb662faaa679f9c3d7ea4
          path: candidate
          persist-credentials: false
      - name: Attach raw audit metadata with the production app unchanged
        working-directory: candidate
        env:
          SCOPE: actual
        run: |
          python3 ../.github/diagnostics/allocation_issue_metadata.py "$SCOPE"
          git diff --check
          python3 - <<'PYCODE'
          import os, subprocess
          expected = {"CardPilotUITests/CoreFlowsUITests.swift"}
          actual = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          assert actual == expected, actual
          PYCODE
          git rev-parse HEAD > ../candidate-base.txt
          git diff --binary > ../candidate.patch
      - name: Run the entire original native test plan with unchanged audits
        working-directory: candidate
        shell: bash
        run: |
          set -o pipefail
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for devices in data["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          xcodebuild test \
            -project CardPilot.xcodeproj \
            -scheme CardPilot \
            -destination "platform=iOS Simulator,id=$device_id" \
            -resultBundlePath ../TestResults.xcresult \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 240 \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee ../diagnostic.log
      - name: Export native summary
        if: always()
        run: xcrun xcresulttool get test-results summary --path TestResults.xcresult > summary.json
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allocation-audit-full-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            TestResults.xcresult
            diagnostic.log
            summary.json
            candidate-base.txt
            candidate.patch
            .github/diagnostics/allocation_issue_metadata.py
          retention-days: 7
          if-no-files-found: error
