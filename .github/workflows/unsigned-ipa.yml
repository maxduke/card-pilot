name: Allocation eager confirmation preview (diagnostic only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [eager_confirmation, eager_confirmation_control]
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      PROBE_IOS_VERSION: "18.5"
      PROBE_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: 34d722d42105940d8dfcf16f03353d0da814d6db
          path: candidate
          persist-credentials: false
      - name: Apply frozen diagnostic and record toolchain
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          git apply "../.github/diagnostics/allocation_${PROBE_VARIANT}.patch"
          git diff --check
          python3 - <<'PYCODE'
          import subprocess
          expected = ["CardPilot/Features/Transactions/TransactionsView.swift", "CardPilotUITests/CoreFlowsUITests.swift"]
          actual = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          assert actual == expected, actual
          PYCODE
          git diff --binary > ../candidate.patch
          git rev-parse HEAD > ../candidate-base.txt
          xcodebuild -version > ../platform.txt
          uname -m >> ../platform.txt
          xcodebuild -showsdks >> ../platform.txt
          xcrun simctl list runtimes -j > ../runtimes.json
          xcrun simctl list devices available -j > ../devices.json
      - name: Verify confirmation input and native audit
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          device_id=$(python3 - <<'PYCODE'
          import json,os
          runtime = "com.apple.CoreSimulator.SimRuntime.iOS-" + os.environ["PROBE_IOS_VERSION"].replace(".", "-")
          with open("../devices.json") as f:
              devices = json.load(f)["devices"].get(runtime, [])
          matches = [d for d in devices if d["name"] == "iPhone 16 Pro" and d.get("isAvailable", False)]
          assert len(matches) == 1, (runtime, matches)
          print(matches[0]["udid"])
          PYCODE
          )
          printf '%s\n' "$device_id" > ../device-id.txt
          selected_tests=(-only-testing:CardPilotUITests/CoreFlowsUITests/testAllocationErrorLocationAndCompletePromptAtLargestTextSize)
          if [[ "$PROBE_VARIANT" == eager_confirmation ]]; then
            selected_tests+=(
              -only-testing:CardPilotUITests/CoreFlowsUITests/testNumericKeyboardDismissalPreservesDraftAndSavedAmounts
              -only-testing:CardPilotUITests/CoreFlowsUITests/testNumericKeyboardDismissalAtLargestTextSize
              -only-testing:CardPilotUITests/CoreFlowsUITests/testPromotionAllocationSearchPreservesSelectionAndAmount
              -only-testing:CardPilotUITests/CoreFlowsUITests/testPromotionAllocationSearchAtLargestTextSize
            )
          fi
          xcodebuild test \
            -project CardPilot.xcodeproj \
            -scheme CardPilot \
            -destination "platform=iOS Simulator,id=$device_id" \
            -resultBundlePath ../TestResults.xcresult \
            "${selected_tests[@]}" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 240 \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee ../diagnostic.log
      - name: Export native summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          xcrun xcresulttool get test-results summary --path TestResults.xcresult > summary.json
      - name: Preserve native evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path exported-attachments
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allocation-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            TestResults.xcresult
            diagnostic.log
            summary.json
            candidate-base.txt
            candidate.patch
            .github/diagnostics/allocation_eager_confirmation*.patch
            platform.txt
            runtimes.json
            devices.json
            device-id.txt
            exported-attachments
          retention-days: 7
          if-no-files-found: error
