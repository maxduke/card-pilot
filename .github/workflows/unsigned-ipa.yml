name: Stable promotion rows (diagnostic only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: 8921accbe236c9fa3924f9ce700323d2b68a726b
          path: candidate
          persist-credentials: false
      - name: Apply frozen native row layout repair
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          git apply --unidiff-zero ../.github/diagnostics/account_card_keyboard_setup.patch
          git diff --check
          python3 - <<'PYCODE'
          import subprocess
          expected = ["CardPilot/Features/Transactions/TransactionsView.swift"]
          actual = subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()
          assert actual == expected, actual
          PYCODE
          git rev-parse HEAD > ../candidate-base.txt
          git diff --binary > ../candidate.patch
      - name: Run native allocation focus, search and validation flows
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for devices in data["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          printf '%s\n' "$device_id" > ../device-id.txt
          xcodebuild test \
            -project CardPilot.xcodeproj \
            -scheme CardPilot \
            -destination "platform=iOS Simulator,id=$device_id" \
            -resultBundlePath ../TestResults.xcresult \
            -only-testing:CardPilotUITests/CoreFlowsUITests/testNumericKeyboardDismissalPreservesDraftAndSavedAmounts \
            -only-testing:CardPilotUITests/CoreFlowsUITests/testNumericKeyboardDismissalAtLargestTextSize \
            -only-testing:CardPilotUITests/CoreFlowsUITests/testPromotionAllocationSearchPreservesSelectionAndAmount \
            -only-testing:CardPilotUITests/CoreFlowsUITests/testPromotionAllocationSearchAtLargestTextSize \
            -only-testing:CardPilotUITests/CoreFlowsUITests/testAllocationErrorLocationAndCompletePromptAtLargestTextSize \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 240 \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee ../diagnostic.log
      - name: Export native summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          xcrun xcresulttool get test-results summary --path TestResults.xcresult > summary.json
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allocation-input-visibility-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            TestResults.xcresult
            diagnostic.log
            summary.json
            candidate-base.txt
            candidate.patch
            device-id.txt
            .github/diagnostics/account_card_keyboard_setup.patch
          retention-days: 7
          if-no-files-found: error
