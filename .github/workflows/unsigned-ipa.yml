name: Allocation native error layout diagnostics (never delivery)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, error_stack]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Apply error layout variant and record text metrics
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          python3 .github/diagnostics/allocation_variant.py "$VARIANT"
          python3 .github/diagnostics/allocation_text_metrics.py
          printf '%s\n' "$VARIANT" > variant.txt
          printf '%s\n' 'Base application, unit and UI test sources: PR40 HEAD 28dbcada5e311c3bf0fffaa683f276586858e9da.' > source.txt
          git diff --check
          git diff > diagnostic.patch
      - name: Native diagnostic with full original prefix
        shell: bash
        run: |
          set -o pipefail
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for devices in data["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          xcodebuild test \
            -project CardPilot.xcodeproj \
            -scheme CardPilot \
            -destination "platform=iOS Simulator,id=$device_id" \
            -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 240 \
            -only-testing:CardPilotTests \
            -only-testing:CardPilotUITests/CoreFlowsUITests/testAccountCycleHistoryFindsOlderPaidCyclesAndClearsFilters \
            -only-testing:CardPilotUITests/CoreFlowsUITests/testAccountCycleHistoryPersistsOlderUnpaidCycleRepaymentAcrossSharedCards \
            -only-testing:CardPilotUITests/CoreFlowsUITests/testAccountHistoryFiltersAndSavedFutureDatesAtLargestTextSize \
            -only-testing:CardPilotUITests/CoreFlowsUITests/testAccountHistoryPaidFilterShowsEmptyResultAtLargestTextSize \
            -only-testing:CardPilotUITests/CoreFlowsUITests/testAdditionalCardDoesNotRepeatReminderOnboarding \
            -only-testing:CardPilotUITests/CoreFlowsUITests/testAllocationErrorLocationAndCompletePromptAtLargestTextSize \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee diagnostic.log
      - name: Export native summary
        if: always()
        run: xcrun xcresulttool get test-results summary --path TestResults.xcresult > summary.json
      - name: Preserve original native evidence and exact variant
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allocation-error-layout-${{ matrix.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            TestResults.xcresult
            diagnostic.log
            summary.json
            variant.txt
            source.txt
            diagnostic.patch
          retention-days: 7
          if-no-files-found: error
