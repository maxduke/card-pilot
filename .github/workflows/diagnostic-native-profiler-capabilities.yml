name: Native profiler capabilities

on:
  push:
    branches: [diagnose/native-profiler-capabilities]

permissions:
  contents: read

concurrency:
  group: native-profiler-capabilities
  cancel-in-progress: false

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - name: Record native tool help and sample an owned child
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p profiler-capability-evidence
          git rev-parse HEAD > profiler-capability-evidence/source-revision.txt
          uname -m > profiler-capability-evidence/architecture.txt
          sw_vers > profiler-capability-evidence/macos-version.txt
          xcodebuild -version > profiler-capability-evidence/xcode-version.txt
          python3 - <<'PY'
          from contextlib import redirect_stdout
          from datetime import datetime, timezone
          from pathlib import Path
          import json, shutil, subprocess
          from scripts.capture_app_idle import run

          output = Path("profiler-capability-evidence")
          tools = ("sample", "spindump", "xcrun", "man")
          (output / "resolved-tools.json").write_text(json.dumps(
              {name: shutil.which(name) for name in tools}, indent=2
          ) + "\n")
          (output / "scope.txt").write_text(
              "Tool help/manuals and one owned /bin/sleep process only. "
              "No App build, simulator, business test or performance measurement.\n"
          )
          with (output / "probe.log").open("w") as log, redirect_stdout(log):
              print(datetime.now(timezone.utc).isoformat(), flush=True)
              run(["/usr/bin/sample", "-h"])
              run(["/usr/bin/man", "-P", "cat", "sample"], timeout=15)
              run(["/usr/bin/man", "-P", "cat", "spindump"], timeout=15)
              run(["xcrun", "xctrace", "help", "record"], timeout=20)
              run(["xcrun", "xctrace", "list", "templates"], timeout=20)
              child = subprocess.Popen(
                  ["/bin/sleep", "120"], stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL
              )
              (output / "owned-child-pid.txt").write_text(str(child.pid) + "\n")
              try:
                  run(["ps", "-p", str(child.pid), "-o", "pid,ppid,etime,time,%cpu,%mem,state,comm"])
                  run(["/usr/bin/sample", str(child.pid), "1", "-file",
                       str(output / "owned-child.sample.txt")], timeout=30)
              finally:
                  if child.poll() is None:
                      child.terminate()
                  try:
                      child.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      child.kill()
                      child.wait(timeout=5)
                  (output / "owned-child-cleanup.json").write_text(json.dumps({
                      "pid": child.pid, "returncode": child.returncode,
                      "reaped": child.poll() is not None
                  }, indent=2) + "\n")
              print(datetime.now(timezone.utc).isoformat(), flush=True)
          PY
      - name: Upload native profiler capability evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-profiler-capabilities
          path: profiler-capability-evidence
          retention-days: 7
          if-no-files-found: error
